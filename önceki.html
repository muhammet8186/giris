    <script>

    <!-- FontAwesome İkonları -->

        body.theme-teal { --panel-bg: rgba(4, 47, 46, 0.95); --quick-panel-bg: rgba(240, 253, 250, 0.95); --panel-border: rgba(20, 184, 166, 0.3); --panel-text: #F0FDFA; --panel-muted: #5EEAD4; --primary-accent: #14B8A6; --primary-hover: #0F766E; --btn-bg: #0F5956; --btn-border: rgba(20, 184, 166, 0.4); }

        body.theme-indigo { --panel-bg: rgba(15, 23, 42, 0.95); --quick-panel-bg: rgba(238, 242, 255, 0.95); --panel-border: rgba(99, 102, 241, 0.3); --panel-text: #EEF2FF; --panel-muted: #A5B4FC; --primary-accent: #6366F1; --primary-hover: #4338CA; --btn-bg: #1E2548; --btn-border: rgba(99, 102, 241, 0.4); }
        
        body.theme-cyber { --panel-bg: rgba(15, 23, 42, 0.95); --quick-panel-bg: rgba(236, 254, 255, 0.95); --panel-border: rgba(6, 182, 212, 0.4); --panel-text: #ECFEFF; --panel-muted: #67E8F9; --primary-accent: #06B6D4; --primary-hover: #0891B2; --btn-bg: #10314C; --btn-border: rgba(6, 182, 212, 0.4); }

        body.theme-midnight { --panel-bg: rgba(3, 7, 18, 0.95); --quick-panel-bg: rgba(243, 244, 246, 0.95); --panel-border: rgba(55, 65, 81, 0.8); --panel-text: #F9FAFB; --panel-muted: #9CA3AF; --primary-accent: #374151; --primary-hover: #1F2937; --btn-bg: #111827; --btn-border: rgba(55, 65, 81, 0.5); }
        body.theme-lime { --panel-bg: rgba(20, 30, 10, 0.95); --quick-panel-bg: rgba(247, 254, 231, 0.95); --panel-border: rgba(132, 204, 22, 0.4); --panel-text: #F7FEE7; --panel-muted: #BEF264; --primary-accent: #84CC16; --primary-hover: #65A30D; --btn-bg: #2A400E; --btn-border: rgba(132, 204, 22, 0.4); }
        body.theme-amethyst { --panel-bg: rgba(24, 9, 39, 0.95); --quick-panel-bg: rgba(250, 245, 255, 0.95); --panel-border: rgba(192, 132, 252, 0.4); --panel-text: #FAF5FF; --panel-muted: #E9D5FF; --primary-accent: #C084FC; --primary-hover: #A855F7; --btn-bg: #341257; --btn-border: rgba(192, 132, 252, 0.4); }
        body.theme-coral { --panel-bg: rgba(35, 15, 15, 0.95); --quick-panel-bg: rgba(255, 241, 242, 0.95); --panel-border: rgba(251, 113, 133, 0.4); --panel-text: #FFF1F2; --panel-muted: #FECDD3; --primary-accent: #FB7185; --primary-hover: #F43F5E; --btn-bg: #4E2025; --btn-border: rgba(251, 113, 133, 0.4); }
        body.theme-sapphire { --panel-bg: rgba(10, 25, 47, 0.95); --quick-panel-bg: rgba(239, 246, 255, 0.95); --panel-border: rgba(59, 130, 246, 0.4); --panel-text: #EFF6FF; --panel-muted: #93C5FD; --primary-accent: #3B82F6; --primary-hover: #1D4ED8; --btn-bg: #11325F; --btn-border: rgba(59, 130, 246, 0.4); }
        body.theme-bronze { --panel-bg: rgba(28, 18, 8, 0.95); --quick-panel-bg: rgba(255, 251, 235, 0.95); --panel-border: rgba(217, 119, 6, 0.4); --panel-text: #FFFBEB; --panel-muted: #FDE68A; --primary-accent: #D97706; --primary-hover: #B45309; --btn-bg: #44290E; --btn-border: rgba(217, 119, 6, 0.4); }
        body.theme-mint { --panel-bg: rgba(6, 30, 22, 0.95); --quick-panel-bg: rgba(240, 253, 250, 0.95); --panel-border: rgba(45, 212, 191, 0.4); --panel-text: #CCFBF1; --panel-muted: #5EEAD4; --primary-accent: #2DD4BF; --primary-hover: #0D9488; --btn-bg: #0E4939; --btn-border: rgba(45, 212, 191, 0.4); }
        body.theme-carbon { --panel-bg: rgba(18, 18, 18, 0.95); --quick-panel-bg: rgba(243, 244, 246, 0.95); --panel-border: rgba(75, 85, 99, 0.6); --panel-text: #F3F4F6; --panel-muted: #9CA3AF; --primary-accent: #4B5563; --primary-hover: #374151; --btn-bg: #262626; --btn-border: rgba(75, 85, 99, 0.5); }

        /* Dinamik Panel ve Renk Sınıfları */
        .modern-panel { background-color: var(--panel-bg) !important; border-color: var(--panel-border) !important; color: var(--panel-text) !important; }
        .quick-access-panel { background-color: var(--quick-panel-bg) !important; border-color: var(--panel-border) !important; color: #1E293B !important; }
        .quick-access-panel h3 { color: #0F172A !important; }
        .quick-access-panel p { color: #475569 !important; }
        .modern-text { color: var(--panel-text) !important; }
        .modern-muted { color: var(--panel-muted) !important; }
        .dynamic-btn { background-color: var(--primary-accent) !important; color: #FFFFFF !important; }
        .dynamic-btn:hover { background-color: var(--primary-hover) !important; }

        /* Hızlı Erişim Buton Kartları */
        .quick-btn-card {
            background-color: var(--btn-bg) !important;
            border: 1px solid var(--btn-border) !important;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .quick-btn-card:hover {
            border-color: var(--primary-accent) !important;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
        }
        .quick-btn-card:hover .quick-title {
            color: var(--primary-accent) !important;
        }


        /* Modern, mobil uyumlu bildirimler */
        .modern-toast-stack {
            position: fixed; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
            z-index: 9999; display: flex; flex-direction: column; gap: 12px;
            width: min(390px, calc(100vw - 32px)); pointer-events: none;
        }
        .modern-toast {
            --toast-accent: #10b981;
            position: relative; display: flex; align-items: flex-start; gap: 12px;
            overflow: hidden; padding: 14px 14px 16px; border-radius: 18px;
            color: #f8fafc; background: rgba(15, 23, 42, .96);
            border: 1px solid rgba(148, 163, 184, .22); border-left: 4px solid var(--toast-accent);
            box-shadow: 0 18px 50px rgba(2, 6, 23, .28), 0 4px 12px rgba(2, 6, 23, .16);
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            pointer-events: auto; opacity: 0; transform: translate3d(24px, -8px, 0) scale(.97);
            transition: opacity .24s ease, transform .28s cubic-bezier(.2,.8,.2,1);
        }
        .modern-toast.is-visible { opacity: 1; transform: translate3d(0,0,0) scale(1); }
        .modern-toast.is-leaving { opacity: 0; transform: translate3d(18px,-5px,0) scale(.98); }
        .modern-toast-icon { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 12px; display: grid; place-items: center; color: var(--toast-accent); background: color-mix(in srgb, var(--toast-accent) 16%, transparent); font-size: 15px; }
        .modern-toast-copy { min-width: 0; flex: 1; padding-top: 1px; }
        .modern-toast-title { font-size: 12px; line-height: 1.4; font-weight: 800; letter-spacing: .01em; margin-bottom: 3px; }
        .modern-toast-message { font-size: 12px; line-height: 1.5; color: #cbd5e1; overflow-wrap: anywhere; }
        .modern-toast-close { flex: 0 0 auto; border: 0; border-radius: 8px; padding: 5px 7px; color: #94a3b8; background: transparent; cursor: pointer; }
        .modern-toast-close:hover, .modern-toast-close:focus-visible { color: #fff; background: rgba(148,163,184,.15); outline: none; }
        .modern-toast-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
        .modern-toast-action { border:0; border-radius:9px; padding:7px 11px; font-size:12px; font-weight:700; cursor:pointer; transition:filter .15s ease, transform .15s ease; }
        .modern-toast-action:hover { filter:brightness(1.08); transform:translateY(-1px); }
        .modern-toast-cancel { color:#e2e8f0; background:rgba(148,163,184,.18); }
        .modern-toast-confirm { color:#fff; background:#dc2626; }
        .modern-toast-progress { position: absolute; bottom: 0; left: 0; height: 3px; width: 100%; background: var(--toast-accent); transform-origin: left; animation: modernToastTimer var(--toast-duration, 4s) linear forwards; opacity: .85; }
        @keyframes modernToastTimer { from { transform: scaleX(1); } to { transform: scaleX(0); } }
        /* Silme onayı: ekranın tam ortasında modal bildirim */
        .delete-confirm-overlay {
            position: fixed; inset: 0; z-index: 10050; display: grid; place-items: center;
            padding: 20px; background: rgba(2, 6, 23, .62); backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px); opacity: 0; transition: opacity .2s ease;
        }
        .delete-confirm-overlay.is-visible { opacity: 1; }
        .delete-confirm-card {
            width: min(440px, 100%); position: relative; display: flex; align-items: flex-start; gap: 14px;
            padding: 22px; border-radius: 22px; color: #f8fafc; background: #0f172a;
            border: 1px solid rgba(148,163,184,.3); border-top: 4px solid #f59e0b;
            box-shadow: 0 28px 90px rgba(0,0,0,.42); transform: translateY(12px) scale(.98);
            transition: transform .22s cubic-bezier(.2,.8,.2,1);
        }
        .delete-confirm-overlay.is-visible .delete-confirm-card { transform: translateY(0) scale(1); }
        .delete-confirm-card .modern-toast-icon { width: 44px; height: 44px; flex-basis: 44px; border-radius: 14px; font-size: 18px; }
        .delete-confirm-card .modern-toast-title { font-size: 15px; margin: 2px 0 7px; }
        .delete-confirm-card .modern-toast-message { font-size: 13px; color: #cbd5e1; }
        .delete-confirm-card .modern-toast-actions { margin-top: 18px; }
        .delete-confirm-card .modern-toast-action { padding: 10px 15px; font-size: 13px; }
        .delete-confirm-card .modern-toast-close { margin: -8px -8px 0 0; }
        @media (max-width: 520px) { .delete-confirm-card { padding: 18px; gap: 11px; } }
        @media (max-width: 520px) {
            .modern-toast-stack { top: max(10px, env(safe-area-inset-top)); left: 10px; right: 10px; width: auto; gap: 9px; }
            .modern-toast { padding: 12px 12px 15px; border-radius: 15px; }
        }
        @media (prefers-reduced-motion: reduce) {
            .modern-toast, .modern-toast.is-visible, .modern-toast.is-leaving { transition: none; transform: none; }
            .modern-toast-progress { animation: none; }
        }

        /* Açık Kutucuklar (Light Inputs) */
        .open-input {
            background-color: #F8FAFC !important;
            border-color: #CBD5E1 !important;
            color: #0F172A !important;
        }
        .open-input::placeholder {
            color: #64748B !important;
        }
        .open-input:focus {
            background-color: #FFFFFF !important;
            border-color: var(--primary-accent) !important;
            outline: none;
        }
    </style>
</head>
<body id="mainBody" class="theme-dark text-slate-800 min-h-screen flex flex-col justify-between relative overflow-x-hidden transition-colors duration-300">

    <!-- ÜST MENÜ (HEADER NAVBAR) -->
    <header id="mainHeader" class="w-full modern-panel backdrop-blur-xl border-b sticky top-0 z-40 px-6 py-4 transition-all shadow-xl">
        <div class="max-w-7xl mx-auto flex items-center justify-between relative min-h-[44px]">
            
            <!-- Sol / Başlık Alanı -->
            <div id="brandHeaderContainer" class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl dynamic-btn flex items-center justify-center font-black text-lg shadow-md shadow-black/30">
                    <i class="fa-solid fa-fingerprint"></i>
                </div>
                <div>
                    <h1 id="brandTitleText" class="text-base sm:text-lg font-black tracking-wider modern-text uppercase transition-colors duration-300">Yönetim ve Erişim Merkezi</h1>
                    <p class="text-[10px] font-semibold modern-muted tracking-widest uppercase">Güvenli Erişim Paneli</p>
                </div>
            </div>

            <!-- Sağ Alan: Tema Değiştirici & Kullanıcı Bilgisi & Çıkış -->
            <div class="ml-auto flex items-center gap-3 z-10">
                <!-- Tema Değiştir Butonu -->
                <button onclick="toggleTheme()" id="themeToggleBtn" class="px-3.5 py-2 text-xs font-bold modern-text bg-black/30 hover:bg-black/50 rounded-2xl transition-all duration-200 border border-white/10 flex items-center gap-2.5 shadow-md group" title="Temayı Değiştir (20 Modern Tema)">
                    <i id="themeIcon" class="fa-solid fa-palette text-amber-400 group-hover:rotate-45 transition-transform duration-300 text-sm"></i>
                    <span id="themeLabelName" class="hidden sm:inline">Dark</span>
                </button>

                <div id="navUserArea" class="hidden items-center gap-3">
                    <div id="userBadgeBox" class="flex items-center gap-2.5 modern-panel border px-3.5 py-1.5 rounded-2xl shadow-md">
                        <div class="w-7 h-7 rounded-xl dynamic-btn flex items-center justify-center font-bold text-xs shadow-inner">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <div class="text-left">
                            <p id="navUserName" class="text-xs font-bold modern-text">Kullanıcı</p>
                            <p id="navUserRole" class="text-[10px] font-semibold modern-muted uppercase tracking-wider">Rol</p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="p-2.5 text-slate-300 hover:text-white bg-black/30 hover:bg-red-600 rounded-2xl transition-all duration-200 border border-white/10 group shadow-md" title="Çıkış Yap">
                        <i class="fa-solid fa-right-from-bracket group-hover:scale-110 transition-transform"></i>
                    </button>
                </div>
            </div>

        </div>
    </header>

    <!-- ANA İÇERİK KAPSAYICISI -->
    <main id="mainContainer" class="flex-grow flex items-center justify-center p-4 sm:p-6 py-10 transition-all duration-300">
        <div class="w-full max-w-5xl space-y-8">

            <!-- GİRİŞ FORMU KARTI -->
            <div id="loginCard" class="max-w-md mx-auto modern-panel backdrop-blur-2xl border rounded-3xl p-8 shadow-2xl relative overflow-hidden transition-all duration-500">
                <div class="absolute top-0 left-0 right-0 h-1.5 dynamic-btn"></div>

                <div class="text-center mb-8 pt-2">
                    <div class="inline-flex items-center justify-center w-16 h-16 dynamic-btn rounded-2xl mb-4 shadow-lg shadow-black/30">
                        <i class="fa-solid fa-shield-halved text-2xl"></i>
                    </div>
                    <h2 id="loginTitleText" class="text-2xl font-black tracking-tight modern-text transition-colors duration-300">Sistem Girişi</h2>
                    <p id="loginSubtitleText" class="text-xs modern-muted mt-1.5 font-medium">Lütfen devam etmek için şifrenizi doğrulayın.</p>
                </div>

                <form onsubmit="handleLogin(event)" class="space-y-5">
                    <div>
                        <label id="loginPassLabel" class="block text-[11px] font-extrabold uppercase tracking-wider modern-text mb-2">Giriş Şifresi</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-500">
                                <i class="fa-solid fa-lock text-sm"></i>
                            </span>
                            <input type="password" id="passwordInput" required
                                class="w-full pl-10 pr-4 py-3 open-input border rounded-2xl text-sm transition-all shadow-inner font-mono"
                                placeholder="Şifrenizi yazınız...">
                        </div>
                    </div>

                    <!-- Hata Mesajı -->
                    <div id="errorAlert" class="hidden bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-2xl text-xs flex items-center gap-2.5 shadow-md">
                        <i class="fa-solid fa-t
